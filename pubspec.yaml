name: envirohub_citizen
description: EnviroHub citizen mobile app for reporting environmental issues.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.1
  geolocator: ^14.0.3
  image_picker: ^1.2.3

  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geocoding: ^5.0.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
